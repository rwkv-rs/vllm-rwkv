[package]
name = "rwkv-api-router"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Streaming multi-model OpenAI API reverse proxy for RWKV"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1.12.0"
clap = { version = "4.5.38", features = ["derive"] }
futures = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tokio-stream = "0.1"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
panic = "abort"
