Match User rwkv-api-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowAgentForwarding no
    AllowTcpForwarding remote
    PermitOpen none
    PermitListen 127.0.0.1:28001 127.0.0.1:28002 127.0.0.1:28003 127.0.0.1:28004
    ForceCommand /bin/false
    PermitTTY no
    PermitTunnel no
    X11Forwarding no
