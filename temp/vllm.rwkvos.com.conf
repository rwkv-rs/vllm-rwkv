upstream rwkv_vllm_router {
    server 127.0.0.1:18000;
    keepalive 128;
}

server {
    listen 80;
    listen [::]:80;
    server_name vllm.rwkvos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vllm.rwkvos.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://vllm.rwkvos.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vllm.rwkvos.com;

    ssl_certificate /etc/letsencrypt/live/vllm.rwkvos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vllm.rwkvos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;

    location = /health {
        proxy_pass http://rwkv_vllm_router;
    }

    location = /metrics {
        proxy_pass http://rwkv_vllm_router;
    }

    location /v1/ {
        proxy_pass http://rwkv_vllm_router;
    }

    location / {
        return 404;
    }
}
