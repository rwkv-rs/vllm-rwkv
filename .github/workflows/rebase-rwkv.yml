name: Rebase RWKV on upstream vLLM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebase-rwkv
  cancel-in-progress: true # was false: a hung run should not block the next

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out rwkv
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: rwkv
          fetch-depth: 0

      - name: Rebase rwkv on upstream/main
        id: rebase
        shell: bash
        run: |
          set -uo pipefail # NOT -e: capture the rebase exit code ourselves

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/vllm-project/vllm.git
          else
            git remote add upstream https://github.com/vllm-project/vllm.git
          fi

          git fetch origin rwkv
          git fetch upstream main

          old_head="$(git rev-parse refs/remotes/origin/rwkv)"
          upstream_head="$(git rev-parse refs/remotes/upstream/main)"
          git switch --force-create rwkv "$old_head"

          # Nothing to do if rwkv already contains upstream/main. The old
          # commit-count==0 guard here protected a non-threat: rwkv being a
          # subset of upstream is a safe no-op, not something to refuse over.
          if git merge-base --is-ancestor "$upstream_head" HEAD; then
            echo "rwkv already contains upstream/main ($upstream_head); nothing to rebase."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rwkv_commit_count="$(git rev-list --count "$upstream_head..HEAD")"
          echo "Replaying $rwkv_commit_count rwkv commits onto upstream/main ($upstream_head)."

          # Capture the rebase result instead of dying on conflict.
          set +e
          git rebase "$upstream_head"
          rc=$?
          set -e

          if [[ "$rc" -ne 0 ]]; then
            conflict_files="$(git diff --name-only --diff-filter=U || true)"
            git rebase --abort || true
            {
              echo "status=conflict"
              echo "old_head=$old_head"
              echo "upstream_head=$upstream_head"
              echo "conflict_files<<EOF"
              echo "$conflict_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            # Surface the conflict in the run summary so it is never silent.
            {
              echo "## :rotating_light: Rebase conflict needs a human"
              echo ""
              echo "- Previous rwkv head: \`$old_head\`"
              echo "- Upstream main head: \`$upstream_head\`"
              echo ""
              echo "Conflicting files:"
              echo '```'
              echo "$conflict_files"
              echo '```'
              echo ""
              echo "Resolve locally with \`git rebase upstream/main\`, then force-push \`rwkv\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Removed the post_rebase_commit_count==0 guard: a clean fast-forward
          # where every rwkv patch already landed upstream is a correct result,
          # not a failure that should block the push.

          if [[ "$(git rev-parse HEAD)" == "$old_head" ]]; then
            echo "rwkv is already based on the latest upstream/main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "status=clean"
            echo "changed=true"
            echo "old_head=$old_head"
            echo "upstream_head=$upstream_head"
            echo "candidate_head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Run lightweight RWKV interface guards
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import ast
          from pathlib import Path

          def class_methods(path: str, class_name: str) -> dict[str, ast.FunctionDef]:
              tree = ast.parse(Path(path).read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      return {
                          item.name: item
                          for item in node.body
                          if isinstance(item, ast.FunctionDef)
                      }
              raise AssertionError(f"{class_name} not found in {path}")

          def positional_args(fn: ast.FunctionDef) -> list[str]:
              return [arg.arg for arg in fn.args.posonlyargs + fn.args.args]

          base = class_methods(
              "vllm/v1/worker/gpu/model_states/interface.py", "ModelState"
          )
          rwkv = class_methods(
              "vllm/v1/worker/gpu/model_states/rwkv.py", "RWKV7ModelState"
          )

          failures: list[str] = []
          for name, base_fn in sorted(base.items()):
              if name.startswith("_") or name not in rwkv:
                  continue
              rwkv_fn = rwkv[name]
              if rwkv_fn.args.vararg is not None:
                  continue

              base_args = positional_args(base_fn)
              rwkv_args = positional_args(rwkv_fn)
              if rwkv_args[: len(base_args)] != base_args:
                  failures.append(
                      f"{name}: RWKV args {rwkv_args} do not accept "
                      f"base ModelState args {base_args}"
                  )

          if failures:
              raise AssertionError("\n".join(failures))
          PY

      - name: Push rebase candidate and open PR
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          candidate_branch="automation/rebase-rwkv"
          git fetch origin "$candidate_branch" || true
          git push --force-with-lease origin HEAD:"$candidate_branch"

          body_file="$(mktemp)"
          cat >"$body_file" <<EOF
          Automated upstream sync candidate for \`rwkv\`.

          - Previous \`rwkv\` head: \`${{ steps.rebase.outputs.old_head }}\`
          - Upstream \`main\` head: \`${{ steps.rebase.outputs.upstream_head }}\`
          - Candidate head: \`${{ steps.rebase.outputs.candidate_head }}\`

          This workflow no longer updates \`rwkv\` directly. Merge this PR only after RWKV validation passes.
          EOF

          pr_number="$(gh pr list \
            --head "$candidate_branch" \
            --base rwkv \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base rwkv \
              --head "$candidate_branch" \
              --title "ci(rwkv): rebase on upstream main" \
              --body-file "$body_file"
          else
            gh pr edit "$pr_number" \
              --title "ci(rwkv): rebase on upstream main" \
              --body-file "$body_file"
          fi
