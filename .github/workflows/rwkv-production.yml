name: RWKV production

on:
  pull_request:
    branches: [rwkv]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [rwkv]
  workflow_dispatch:
    inputs:
      action:
        description: Release, deploy an existing SHA, or roll back
        required: true
        type: choice
        options:
          - release
          - redeploy
          - rollback
      target:
        description: Production components to release, redeploy, or roll back
        required: true
        default: all
        type: choice
        options:
          - all
          - models
          - router
      sha:
        description: 40-character source SHA for redeploy
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rwkv-production-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authorize:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Reject untrusted GPU revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const trustedLabels = new Set(['verified', 'ready', 'ready-run-all-tests']);
            const pull = context.payload.pull_request;
            const trustedAssociation = trustedAssociations.has(pull.author_association);
            const trustedLabel = pull.labels.some(label => trustedLabels.has(label.name));
            const { data: mergedPulls } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged author:${pull.user.login}`,
              per_page: 4,
            });
            const establishedContributor = mergedPulls.total_count >= 4;
            if (!trustedAssociation && !trustedLabel && !establishedContributor) {
              core.setFailed(
                'This revision is not authorized to execute on the RWKV GPU runner.'
              );
            }

  scope:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.scope.outputs.models }}
      router: ${{ steps.scope.outputs.router }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Detect production components
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            models=true
            router=true
            [[ $TARGET != router ]] || models=false
            [[ $TARGET != models ]] || router=false
          else
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            models=false
            router=false
            if grep -Eq '^(vllm/|csrc/|cmake/|requirements/|setup\.py$|pyproject\.toml$|CMakeLists\.txt$|\.github/workflows/rwkv-production\.yml$|tools/deploy_rwkv_production\.sh$)' <<<"$changed"; then
              models=true
            fi
            if grep -Eq '^(\.github/workflows/rwkv-production\.yml$|tools/deploy_rwkv_production\.sh$|temp/(rwkv-api-router/|rwkv_api_router\.py$|api\.rwkv\.rs\.toml$|rwkv-(api|vllm)-tunnel\.service$|rwkv-vllm-certbot\.(service|timer)$|sshd-rwkv-api-tunnel\.conf$|vllm-rwkv-api-router\.service$|vllm\.rwkvos\.com\.conf$))' <<<"$changed"; then
              router=true
            fi
          fi
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "router=$router" >> "$GITHUB_OUTPUT"

  router:
    if: >-
      always() && needs.scope.result == 'success' &&
      needs.scope.outputs.router == 'true' &&
      (github.event_name == 'push' || github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')) &&
      (needs.authorize.result == 'success' || needs.authorize.result == 'skipped')
    needs: [authorize, scope]
    runs-on: [self-hosted, linux, x64, "${{ 'rwkv-pro6000' }}"]
    timeout-minutes: 30
    env:
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure Rust tooling
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check gateway and deployment sources
        run: |
          uv tool run --from pre-commit==4.5.1 \
            pre-commit run --hook-stage manual --files \
              .github/workflows/rwkv-production.yml tools/deploy_rwkv_production.sh \
              temp/rwkv-api-router/Cargo.toml temp/rwkv-api-router/Cargo.lock \
              temp/rwkv-api-router/src/main.rs temp/vllm-rwkv-api-router.service \
              temp/rwkv-vllm-tunnel.service temp/rwkv-vllm-certbot.service \
              temp/rwkv-vllm-certbot.timer temp/sshd-rwkv-api-tunnel.conf \
              temp/vllm.rwkvos.com.conf
      - name: Build and test the RWKV API router
        run: |
          set -euo pipefail
          ulimit -n 65536
          timeout 60s cargo fmt --manifest-path temp/rwkv-api-router/Cargo.toml -- --check
          timeout 300s cargo clippy --locked --manifest-path temp/rwkv-api-router/Cargo.toml --all-targets -- -D warnings
          timeout 300s cargo test --locked --manifest-path temp/rwkv-api-router/Cargo.toml
          timeout 300s cargo build --release --locked --manifest-path temp/rwkv-api-router/Cargo.toml
      - name: Package the exact successful router
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          artifact_root="/home/caizus/artifacts/vllm-rwkv/$GITHUB_SHA"
          bundle="$artifact_root/rwkv-api-router-$GITHUB_SHA.tar.gz"
          release="$RUNNER_TEMP/rwkv-router-release"
          mkdir -p "$artifact_root" "$release"
          test ! -e "$bundle"
          printf '%s\n' "$GITHUB_SHA" > "$release/GIT_SHA"
          install -Dm 0755 temp/rwkv-api-router/target/release/rwkv-api-router "$release/bin/rwkv-api-router"
          install -Dm 0644 temp/vllm-rwkv-api-router.service "$release/temp/vllm-rwkv-api-router.service"
          install -Dm 0644 temp/vllm.rwkvos.com.conf "$release/temp/vllm.rwkvos.com.conf"
          tar -czf "$bundle" -C "$release" GIT_SHA bin temp
          (cd "$artifact_root" && sha256sum "$(basename "$bundle")" > "$(basename "$bundle").sha256")

  quality-gate:
    if: always()
    needs: [authorize, scope, router]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful router checks
        env:
          AUTHORIZATION: ${{ needs.authorize.result }}
          SCOPE: ${{ needs.scope.result }}
          ROUTER_REQUIRED: ${{ needs.scope.outputs.router }}
          ROUTER_RESULT: ${{ needs.router.result }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          [[ $AUTHORIZATION == success || $AUTHORIZATION == skipped ]]
          [[ $SCOPE == success ]]
          if [[ $EVENT == workflow_dispatch && $ACTION != release ]]; then
            exit 0
          fi
          if [[ $ROUTER_REQUIRED == true ]]; then
            [[ $ROUTER_RESULT == success ]]
          fi

  deploy:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.action == 'release' ||
         github.event.inputs.action == 'redeploy' ||
         github.event.inputs.action == 'rollback'))) &&
      (needs.scope.outputs.models == 'true' || needs.scope.outputs.router == 'true') &&
      needs.quality-gate.result == 'success'
    needs: [scope, quality-gate, router]
    runs-on: [self-hosted, linux, x64, "${{ 'rwkv-pro6000' }}"]
    timeout-minutes: 360
    environment: production
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_JUMP_HOST: ${{ secrets.DEPLOY_JUMP_HOST }}
      DEPLOY_JUMP_PORT: ${{ secrets.DEPLOY_JUMP_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      FRONTEND_DEPLOY_SSH_KEY: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}
      FRONTEND_DEPLOY_KNOWN_HOSTS: ${{ secrets.FRONTEND_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_MODELS: ${{ needs.scope.outputs.models }}
      DEPLOY_ROUTER: ${{ needs.scope.outputs.router }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ (github.event_name == 'push' || github.event.inputs.action == 'release') && github.sha || 'rwkv' }}

      - name: Configure deployment SSH identity
        run: |
          set -euo pipefail
          install -m 0700 -d "$RUNNER_TEMP/deploy-ssh"
          if [[ $DEPLOY_MODELS == true ]]; then
            test -n "$DEPLOY_PORT"
            test -n "$DEPLOY_USER"
            test -n "$DEPLOY_JUMP_HOST"
            test -n "$DEPLOY_JUMP_PORT"
            test -n "$DEPLOY_SSH_KEY"
            test -n "$DEPLOY_KNOWN_HOSTS"
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
            chmod 0600 "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts"
            proxy_command="ssh -F /dev/null -i $RUNNER_TEMP/deploy-ssh/key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts -p $DEPLOY_JUMP_PORT -W %h:%p $DEPLOY_USER@$DEPLOY_JUMP_HOST"
            ssh -F /dev/null -i "$RUNNER_TEMP/deploy-ssh/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" \
              -o "ProxyCommand=$proxy_command" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@192.168.0.129" true
            ssh -F /dev/null -i "$RUNNER_TEMP/deploy-ssh/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" \
              -o "ProxyCommand=$proxy_command" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@192.168.0.157" true
          fi
          if [[ $DEPLOY_ROUTER == true ]]; then
            test -n "$FRONTEND_DEPLOY_SSH_KEY"
            test -n "$FRONTEND_DEPLOY_KNOWN_HOSTS"
            printf '%s\n' "$FRONTEND_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/frontend-key"
            printf '%s\n' "$FRONTEND_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/frontend-known_hosts"
            chmod 0600 "$RUNNER_TEMP/deploy-ssh/frontend-key" "$RUNNER_TEMP/deploy-ssh/frontend-known_hosts"
            ssh -F /dev/null -i "$RUNNER_TEMP/deploy-ssh/frontend-key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/frontend-known_hosts" \
              caizus@47.107.93.180 true
          fi

      - name: Install model backends from source, deploy router, or roll back
        env:
          REQUESTED_ACTION: ${{ github.event.inputs.action }}
          REQUESTED_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          run_target() {
            local action=$1
            local host=$2
            local target="$DEPLOY_USER@$host"
            local deployment_command=$action
            local proxy_command="ssh -F /dev/null -i $RUNNER_TEMP/deploy-ssh/key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts -p $DEPLOY_JUMP_PORT -W %h:%p $DEPLOY_USER@$DEPLOY_JUMP_HOST"
            local -a ssh_args=(
              -F /dev/null
              -i "$RUNNER_TEMP/deploy-ssh/key"
              -o BatchMode=yes
              -o IdentitiesOnly=yes
              -o StrictHostKeyChecking=yes
              -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts"
              -o "ProxyCommand=$proxy_command"
              -p "$DEPLOY_PORT"
            )
            local -a scp_args=(
              -F /dev/null
              -i "$RUNNER_TEMP/deploy-ssh/key"
              -o BatchMode=yes
              -o IdentitiesOnly=yes
              -o StrictHostKeyChecking=yes
              -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts"
              -o "ProxyCommand=$proxy_command"
              -P "$DEPLOY_PORT"
            )

            if [[ $host == "$frontend_host" ]]; then
              target="caizus@$host"
              deployment_command="$action-router"
              ssh_args=(
                -F /dev/null -i "$RUNNER_TEMP/deploy-ssh/frontend-key"
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/frontend-known_hosts"
                -p 22
              )
              scp_args=(
                -F /dev/null -i "$RUNNER_TEMP/deploy-ssh/frontend-key"
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/frontend-known_hosts"
                -P 22
              )
            fi
            scp "${scp_args[@]}" tools/deploy_rwkv_production.sh \
              "$target:/tmp/deploy_rwkv_production.sh" || return 1
            if [[ $action == rollback ]]; then
              ssh "${ssh_args[@]}" "$target" bash -s -- "$deployment_command" <<'REMOTE' || return 1
          set -euo pipefail
          sudo install -m 0755 /tmp/deploy_rwkv_production.sh /usr/local/sbin/deploy_rwkv_production
          sudo /usr/local/sbin/deploy_rwkv_production "$1"
          REMOTE
              return
            fi

            if [[ $host != "$frontend_host" ]]; then
              ssh "${ssh_args[@]}" \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
                "$target" bash -s -- "$release_sha" "$host" <<'REMOTE' || return 1
          set -euo pipefail
          download_proxy=http://127.0.0.1:7890
          if [[ $2 == 192.168.0.157 ]]; then
            bash -c 'source /home/caizus/clashctl/scripts/cmd/clashctl.sh && clashon'
            download_proxy=http://127.0.0.1:1218
          fi
          sudo install -m 0755 /tmp/deploy_rwkv_production.sh /usr/local/sbin/deploy_rwkv_production
          sudo env HTTP_PROXY="$download_proxy" HTTPS_PROXY="$download_proxy" \
            NO_PROXY=127.0.0.1,localhost \
            /usr/local/sbin/deploy_rwkv_production deploy "$1"
          REMOTE
              return
            fi

            local target_checksum="$router_bundle.sha256"
            scp "${scp_args[@]}" "$router_bundle" "$target_checksum" "$target:/tmp/" ||
              return 1
            if ! ssh "${ssh_args[@]}" "$target" bash -s -- \
              "$release_sha" "$(basename "$router_bundle")" \
              "$(basename "$target_checksum")" "$deployment_command" <<'REMOTE'
          set -euo pipefail
          release_sha=$1
          bundle_name=$2
          checksum_name=$3
          deployment_command=$4
          sudo install -m 0755 /tmp/deploy_rwkv_production.sh /usr/local/sbin/deploy_rwkv_production
          sudo install -d -m 0755 /opt/rwkv/vllm/incoming
          sudo mv "/tmp/$bundle_name" /opt/rwkv/vllm/incoming/
          sudo mv "/tmp/$checksum_name" /opt/rwkv/vllm/incoming/
          sudo /usr/local/sbin/deploy_rwkv_production "$deployment_command" \
            "$release_sha" "/opt/rwkv/vllm/incoming/$bundle_name" \
            "/opt/rwkv/vllm/incoming/$checksum_name"
          REMOTE
            then
              return 1
            fi
            if ! curl --noproxy '*' -fsS --connect-timeout 5 --max-time 15 https://vllm.rwkvos.com/health; then
              run_target rollback "$frontend_host" || true
              return 1
            fi
          }

          readonly small_host=192.168.0.129
          readonly large_host=192.168.0.157
          readonly frontend_host=47.107.93.180
          if [[ "${{ github.event_name }}" == workflow_dispatch && \
                "$REQUESTED_ACTION" == rollback ]]; then
            if [[ $DEPLOY_ROUTER == true ]]; then
              run_target rollback "$frontend_host"
            fi
            if [[ $DEPLOY_MODELS == true ]]; then
              run_target rollback "$large_host"
              run_target rollback "$small_host"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == push ||
                "$REQUESTED_ACTION" == release ]]; then
            release_sha="$GITHUB_SHA"
          else
            release_sha="$REQUESTED_SHA"
          fi
          [[ $release_sha =~ ^[0-9a-f]{40}$ ]]
          router_bundle="/home/caizus/artifacts/vllm-rwkv/$release_sha/rwkv-api-router-$release_sha.tar.gz"
          if [[ $DEPLOY_ROUTER == true ]]; then
            test -f "$router_bundle"
            test -f "$router_bundle.sha256"
          fi

          if [[ $DEPLOY_MODELS == true ]]; then
            run_target deploy "$small_host"
            if ! run_target deploy "$large_host"; then
              run_target rollback "$small_host" || true
              exit 1
            fi
          fi
          if [[ $DEPLOY_ROUTER == true ]] && ! run_target deploy "$frontend_host"; then
            if [[ $DEPLOY_MODELS == true ]]; then
              run_target rollback "$large_host" || true
              run_target rollback "$small_host" || true
            fi
            exit 1
          fi

      - name: Remove temporary SSH material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$RUNNER_TEMP/deploy-ssh/frontend-key" "$RUNNER_TEMP/deploy-ssh/frontend-known_hosts"
